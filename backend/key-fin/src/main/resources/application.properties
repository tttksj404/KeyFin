spring.application.name=key-fin

# ── DB (Docker: 로컬 개발은 compose의 mysql이 호스트 3307로 매핑됨.
#      앱을 컨테이너로 띄우면 compose가 DB_URL=jdbc:mysql://mysql:3306/... 을 주입)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/keyfin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:keyfin}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA — 스키마 관리는 Flyway 전담, JPA는 검증만
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Redis (JWT Refresh 토큰 저장 — 앱 컨테이너 실행 시 compose가 REDIS_HOST=redis 주입)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Flyway (classpath:db/migration 기본 경로 사용)
spring.flyway.enabled=true

# ── 로컬 오버라이드 파일이 있으면 로드 (.gitignore 처리됨)
spring.config.import=optional:application-local.properties
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:336h}

# CORS — 브라우저 프론트엔드의 허용 Origin (쉼표 구분)
# 로컬 개발은 포트가 자주 바뀌므로 localhost 전 포트를 허용한다. 배포 환경은 CORS_ALLOWED_ORIGINS로 지정한다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*],https://j15a408.p.ssafy.io}

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# 금융망 API
finance.api.base-url=${FINANCE_API_BASE_URL}
finance.api.api-key=${FINANCE_API_KEY}
finance.api.connect-timeout=${FINANCE_API_CONNECT_TIMEOUT:3s}
finance.api.read-timeout=${FINANCE_API_READ_TIMEOUT:5s}
finance.api.max-attempts=${FINANCE_API_MAX_ATTEMPTS:3}
finance.api.retry-base-delay=${FINANCE_API_RETRY_BASE_DELAY:100ms}
finance.api.retry-max-delay=${FINANCE_API_RETRY_MAX_DELAY:1s}
finance.api.retry-time-limit=${FINANCE_API_RETRY_TIME_LIMIT:8s}

# AI 코칭 API — 토큰은 환경 변수 COACHING_API_TOKEN 으로만 받는다.
# 여기에 빈 기본값을 두면 프로퍼티가 존재하는 것으로 잡혀 조건부 등록이 풀린다.
coaching.api.base-url=${COACHING_API_BASE_URL:http://localhost:8000}
coaching.api.connect-timeout=${COACHING_API_CONNECT_TIMEOUT:3s}
coaching.api.read-timeout=${COACHING_API_READ_TIMEOUT:60s}

# 배치 크론 — 초 분 시 일 월 요일, Asia/Seoul. 배포 환경은 환경 변수로 주기를 바꾼다.
transaction.sync.cron=${TRANSACTION_SYNC_CRON:0 * * * * *}
transaction.notification.cleanup-cron=${TRANSACTION_NOTIFICATION_CLEANUP_CRON:0 0 21 * * *}
payment.sync.cron=${PAYMENT_SYNC_CRON:0 0 8,17 * * *}
payment.transfer-proposal.cron=${TRANSFER_PROPOSAL_CRON:0 30 8 * * *}
payment.transfer-recover.cron=${TRANSFER_RECOVER_CRON:0 0/30 * * * *}

# FCM — 명시적으로 활성화한 환경에서만 Firebase 인증을 읽음
fcm.enabled=${FCM_ENABLED:false}

# 배포 준비 상태 확인
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis

# 응답에 내부 구성과 상세 오류를 노출하지 않음
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
