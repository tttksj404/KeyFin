<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI,Malgun Gothic,sans-serif"><rect width="760" height="320" fill="#ffffff"/><text x="380.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">결정론 경로 확대: 모델 호출 질문 감소  (전체 570문항)</text><text x="166" y="132" text-anchor="end" font-size="14" font-weight="600" fill="#1e293b">변경 전</text><rect x="180" y="100" width="382" height="54" fill="#16a34a" rx="3"/><rect x="562" y="100" width="118" height="54" fill="#f59e0b" rx="3"/><text x="371" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">결정론 435 (76%)</text><text x="621" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">모델 135</text><text x="166" y="222" text-anchor="end" font-size="14" font-weight="600" fill="#1e293b">게이트 확대 후</text><rect x="180" y="190" width="418" height="54" fill="#16a34a" rx="3"/><rect x="598" y="190" width="82" height="54" fill="#f59e0b" rx="3"/><text x="389" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">결정론 476 (83%)</text><text x="639" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">모델 94</text><text x="180" y="290" font-size="13" fill="#64748b">모델 호출 질문 135 → 94 (−30%). 개인·변동·자유형 질문은 이동 0건(정확도 무회귀).</text><rect x="180" y="262" width="14" height="14" fill="#16a34a"/><text x="200" y="274" font-size="13" fill="#1e293b">결정론(즉시 응답, 모델 호출 없음)</text><rect x="480" y="262" width="14" height="14" fill="#f59e0b"/><text x="500" y="274" font-size="13" fill="#1e293b">모델 호출 필요</text></svg>